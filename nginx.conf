server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite versiona estos archivos por hash de contenido (index-Cx7f2a1b.js):
    # si el contenido cambia, cambia el nombre. Por eso se pueden cachear
    # "para siempre" sin riesgo de servir una versión vieja tras un deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router maneja el ruteo del lado del cliente (/mi-cuenta, etc.).
    # Sin este fallback, recargar (F5) en una ruta interna da 404: Nginx
    # busca un archivo /mi-cuenta que no existe en disco.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
